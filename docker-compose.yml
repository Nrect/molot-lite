services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: molotlite
      POSTGRES_PASSWORD: molotlite
      POSTGRES_DB: molotlite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molotlite -d molotlite"]
      interval: 2s
      timeout: 2s
      retries: 15
